# wii-gb-operator settings
# Copy to: sd:/apps/wii-gb-operator/settings.ini

# Display scale for GBA games without a custom border (240x160 native).
# 0.0 = fill screen (aspect-correct letterbox/pillarbox)
# 0.8 = centred at 80% of screen (default)
# 1.0 = fill screen without aspect correction
scale_gba=0.8

# Display scale for GBA games when a custom border is active (320x240 canvas).
# 1.0 = fill screen (recommended — border is designed for full screen)
scale_gba_border=1.0

# Display scale for GB/GBC games (160x144 native, or 256x224 with SGB border).
scale_gb=1.1

# Developer menu visibility.
# 0 = hidden (default) — shows the standard player-facing frontend only
# 1 = developer mode — adds a "Developer Menu" option to the frontend that
#     exposes raw dump/upload commands, cart detection, and log management
dev_menu=0

# Use old firmware? Tested on v9.2.0 (2023).
# 0 = new firmware protocol (default — GB Operator firmware v10.0.10 and later)
# 1 = old firmware protocol (GB Operator firmware v9.2.0 and earlier).
#     Old firmware is unsupported going forward; this exists so testers who
#     haven't updated their GB Operator can keep using the previously-working
#     protocol. This is a manual choice only — the app does not try to detect
#     which firmware is connected. Can also be toggled at runtime from the
#     Developer Menu (dev_menu=1) without editing this file, though that
#     change is session-only and not saved back here.
use_old_firmware=0

# Automatic re-detection when the background cart poll senses a change.
# 0 = disabled (default for now) — the poll loop still tracks presence/
#     absence for the UI, but never triggers the expensive, blocking
#     detect-cart sequence on its own; use manual "Detect Cart" / "Detect
#     Cart Swap" instead. Recommended while testing dump reliability, since
#     the auto-triggered sequence can freeze controls for several seconds
#     on a bad connection.
# 1 = re-enable automatic re-detection on a sensed cart change.
auto_detect_cart=0
